<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van al Aeropuerto · Tablero de gestión (maqueta Power BI)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F3;--sf:#fff;--ink:#1D2430;--mut:#657080;--ln:#DDE1E7;--hd:#1D2430;--br:#F26A1B;--c1:#E8590C;--c2:#2F5FC4;--c3:#1F8A47;--c4:#B7791F;--red:#CF3425;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--sf:#1B212A;--ink:#E8EAEE;--mut:#98A2B3;--ln:#2C3440;--hd:#0C0F13;--c1:#FF8A3D;--c2:#6E94EA;--c3:#46B873;--c4:#E0A94A;--red:#EF6A5B}}
:root[data-theme="dark"]{--bg:#12161C;--sf:#1B212A;--ink:#E8EAEE;--mut:#98A2B3;--ln:#2C3440;--hd:#0C0F13;--c1:#FF8A3D;--c2:#6E94EA;--c3:#46B873;--c4:#E0A94A;--red:#EF6A5B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:64px}
header{background:var(--hd);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lg{background:var(--br);color:#fff;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:17px}
header h1{font-size:16px;font-weight:600;margin:0}
header p{margin:0;font-size:12px;opacity:.7}
.demo{margin-left:auto;font-size:12px;background:#ffffff1f;border-radius:20px;padding:3px 12px}
.slc{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--sf);border-bottom:1px solid var(--ln)}
.slc span{font-size:12.5px;border:1px solid var(--ln);border-radius:6px;padding:4px 10px;color:var(--mut)}
.slc b{color:var(--ink);font-weight:500}
main{padding:16px 20px;max-width:1240px;margin:0 auto}
.pg{display:none}.pg.on{display:block}
.pg>h2{font-size:17px;margin:0 0 2px;font-weight:600}
.pg>.lead{margin:0 0 14px;color:var(--mut);font-size:13px;max-width:78ch}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-bottom:12px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:820px){.g>*{grid-column:1/-1}.g>.s3{grid-column:span 6}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px 16px;min-width:0}
.card h3{font-size:13.5px;font-weight:600;margin:0}
.sub{font-size:12px;color:var(--mut);margin:1px 0 10px}
.k{border-left:3px solid var(--k)}
.kl{font-size:12px;color:var(--mut)}
.kv{font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kn{font-size:11.5px;color:var(--mut)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:6px}
.lgd i{display:inline-block;width:14px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.tx{fill:var(--mut);font-size:10px;font-family:inherit}
.hr{display:grid;grid-template-columns:104px 1fr 76px;gap:8px;align-items:center;margin:8px 0;font-size:12.5px}
.hr b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.tr{background:var(--bg);height:14px;border-radius:3px;display:flex}
.tr i{display:block;height:100%}
.fr .tr{justify-content:center}
.hm{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.hm th{font-weight:500;color:var(--mut);font-size:11.5px;text-align:center;padding:2px}
.hm th:first-child{text-align:left;width:92px}
.hm td{text-align:center;padding:7px 2px;border-radius:4px;color:#1D2430}
.cols{display:flex;gap:16px;align-items:flex-end;height:170px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.col i{width:100%;max-width:70px;border-radius:3px 3px 0 0}
.col b{font-weight:500;font-size:12.5px}.col span{font-size:11.5px;color:var(--mut);text-align:center}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow div{flex:1 1 130px;border:1px solid var(--ln);border-radius:8px;padding:9px 11px;font-size:12px;background:var(--bg)}
.flow div b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.flow div.ar{flex:0 0 auto;border:0;background:none;padding:0;align-self:center;color:var(--mut);font-size:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--hd);display:flex;gap:2px;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;z-index:5}
.tabs button{background:none;border:0;color:#fff;opacity:.7;font:inherit;font-size:13px;padding:8px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--br);opacity:1;font-weight:500}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.ft{font-size:12px;color:var(--mut);margin:6px 0 0}
@media print{.tabs{display:none}.pg{display:block!important;break-after:page}body{padding-bottom:0}}
</style>
</head>
<body>
<header><span class="lg">V</span><div><h1>Van al Aeropuerto · Tablero de gestión</h1><p>Maqueta del informe de Power BI para los socios</p></div><span class="demo">Datos ilustrativos</span></header>
<div class="slc" aria-label="Segmentadores comunes a todas las páginas"><span>Período <b>Jul 2025 – Jun 2026</b></span><span>Punto de servicio <b>Todos</b></span><span>Categoría <b>Todas</b></span><span>Segmento <b>Todos</b></span><span>Canal <b>Todos</b></span></div>
<main id="root"></main>
<nav class="tabs" id="tabs" aria-label="Páginas del informe"></nav>
<script>
const $=s=>document.querySelector(s);
const M=['Jul','Ago','Sep','Oct','Nov','Dic','Ene','Feb','Mar','Abr','May','Jun'];
const R=[780,610,590,640,680,860,920,760,640,650,600,630];
const A=[112,98,95,101,104,118,121,108,96,97,92,96];
const sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>sum(a)/a.length;
const IR=R.map(v=>Math.round(v/avg(R)*100));
const pear=(a,b)=>{const x=avg(a),y=avg(b);return sum(a.map((v,i)=>(v-x)*(b[i]-y)))/Math.sqrt(sum(a.map(v=>(v-x)**2))*sum(b.map(v=>(v-y)**2)))};
const fm=v=>v.toLocaleString('es-AR');
const pc=(v,d=0)=>v.toLocaleString('es-AR',{maximumFractionDigits:d,minimumFractionDigits:d})+' %';

function line(lab,S,o={}){
  const w=640,h=240,l=44,r=12,t=12,b=26,n=lab.length,st=(w-l-r)/(n-1);
  const all=S.flatMap(s=>s.v).concat(o.band?o.band.lo.concat(o.band.hi):[]).filter(v=>v!=null);
  const mn=Math.floor(Math.min(...all)*.9/10)*10,mx=Math.ceil(Math.max(...all)*1.05/10)*10;
  const y=v=>t+(h-t-b)*(1-(v-mn)/(mx-mn)),x=i=>l+st*i;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria}" style="width:100%;height:auto;display:block">`;
  (o.shade||[]).forEach(([a,c])=>{s+=`<rect x="${Math.max(l,x(a)-st/2)}" y="${t}" width="${(c-a+1)*st}" height="${h-t-b}" fill="var(--br)" opacity=".09"/>`});
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text class="tx" x="${l-6}" y="${y(v)+3}" text-anchor="end">${Math.round(v)}</text>`}
  if(o.band){let p=[],q=[];o.band.hi.forEach((v,i)=>{if(v!=null){p.push(x(i)+','+y(v));q.unshift(x(i)+','+y(o.band.lo[i]))}});s+=`<polygon points="${p.concat(q).join(' ')}" fill="var(--c2)" opacity=".16"/>`}
  S.forEach(e=>{let d='',pv=false;e.v.forEach((v,i)=>{if(v==null){pv=false;return}d+=(pv?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pv=true});
    s+=`<path d="${d}" fill="none" stroke="${e.c}" stroke-width="2.4"${e.d?' stroke-dasharray="6 4"':''}/>`;
    if(!e.d)e.v.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${e.c}"/>`})});
  lab.forEach((m,i)=>{s+=`<text class="tx" x="${x(i)}" y="${h-8}" text-anchor="middle">${m}</text>`});
  return s+'</svg>';
}
const lgd=a=>`<div class="lgd">${a.map(([t,c,d])=>`<span><i style="border-color:${c};${d?'border-top-style:dashed':''}"></i>${t}</span>`).join('')}</div>`;
const card=(s,t,u,b)=>`<div class="card s${s}"><h3>${t}</h3><div class="sub">${u}</div>${b}</div>`;
const kpi=(l,v,n,c)=>`<div class="card k s3" style="--k:${c}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="kn">${n}</div></div>`;
const hb=(it,mx,f,c)=>it.map(([l,v])=>`<div class="hr"><span>${l}</span><div class="tr"><i style="width:${v/mx*100}%;background:${c}"></i></div><b>${f(v)}</b></div>`).join('');
const heat=(rows,cols,val,cell)=>`<table class="hm"><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr><th>${r}</th>${cols.map((c,j)=>cell(val(i,j))).join('')}</tr>`).join('')}</table>`;

/* ---- datos ilustrativos ---- */
const FR=['00–04 h','04–08 h','08–12 h','12–16 h','16–20 h','20–24 h'],DS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const fw=[.25,.8,.5,.55,.75,.6],dw=[1,.7,.7,.75,.95,.8,1.02];
const hv=(i,j)=>Math.round(fw[j]*dw[i]*40*(.85+.3*(((i*37+j*11)%17)/17)));
let hmax=0;for(let i=0;i<7;i++)for(let j=0;j<6;j++)hmax=Math.max(hmax,hv(i,j));
const CAT=[['Auto Urbano',430,45,25],['Auto Ejecutivo',200,25,10],['Kangoo',85,20,15],['Van (tercerizada)',40,25,35]];
const cb=[.97,.95,.88,.74],fp=[.02,.08,0,.02,.05,.09];
const tA=sum(CAT.map(c=>c[1])),tB=sum(CAT.map(c=>c[2])),tC=sum(CAT.map(c=>c[3])),tT=tA+tB+tC;

const P1=()=>`<h2>1. Demanda y estacionalidad</h2><p class="lead">Cuándo y dónde se concentra la demanda, y si sus variaciones responden al movimiento del mercado (pasajeros ANAC) o a la captación propia.</p>
<div class="g">${kpi('Solicitudes del período',fm(sum(R)),'12 meses · promedio '+fm(Math.round(avg(R)))+' por mes','var(--c1)')}${kpi('Mes pico (índice de estacionalidad)',M[IR.indexOf(Math.max(...IR))]+' · '+Math.max(...IR),'100 = demanda promedio','var(--c2)')}${kpi('Correlación con pasajeros ANAC',pear(R,A).toLocaleString('es-AR',{maximumFractionDigits:2}),'reservas propias vs. mercado','var(--c3)')}${kpi('Punto de servicio principal','Ezeiza · 52 %','sobre el total de solicitudes','var(--c4)')}</div>
<div class="g">${card(8,'Solicitudes por mes frente al mercado','Índice de estacionalidad (100 = promedio). Zonas sombreadas: feriados y vacaciones',lgd([['Reservas Van al Aeropuerto','var(--c1)'],['Pasajeros ANAC','var(--c2)',1]])+line(M,[{v:IR,c:'var(--c1)'},{v:A,c:'var(--c2)',d:1}],{shade:[[0,0],[5,7]],aria:'Índice de estacionalidad mensual de reservas y pasajeros ANAC'}))}
${card(4,'Solicitudes por punto de servicio','Participación sobre el total',hb([['Ezeiza',52],['Aeroparque',38],['Retiro / Buquebus',10]],60,v=>v+' %','var(--c1)')+'<p class="note">Ezeiza concentra más de la mitad de la demanda.</p>')}</div>
<div class="g">${card(12,'Solicitudes por día de la semana y franja horaria','Promedio de solicitudes por semana. Más oscuro = más demanda',heat(DS,FR,hv,v=>`<td style="background:color-mix(in srgb,var(--c1) ${Math.round(v/hmax*80)}%,#FFF1E6)">${v}</td>`))}</div>`;

const P2=()=>{const mx=Math.max(...CAT.map(c=>c[1]+c[2]+c[3]));
return `<h2>2. Capacidad y cobertura</h2><p class="lead">Dónde la flota tercerizada resulta insuficiente: el deterioro conjunto de cobertura y rechazo en una misma categoría y franja es la señal para incorporar conductores.</p>
<div class="g">${kpi('Cobertura global',pc((tA+tB)/tT*100,1),'solicitudes asignadas ÷ recibidas','var(--c3)')}${kpi('Tasa de rechazo de conductores','24 %','rechazos y vencimientos ÷ envíos','var(--red)')}${kpi('Reservas sin cubrir',fm(tC),pc(tC/tT*100,1)+' tras la segunda vuelta','var(--c4)')}${kpi('Categoría más crítica','Van · '+pc(CAT[3][3]/(CAT[3][1]+CAT[3][2]+CAT[3][3])*100),'sin cubrir sobre sus solicitudes','var(--c2)')}</div>
<div class="g">${card(6,'Resultado de las solicitudes por categoría','Cantidad de solicitudes',lgd([['Asignada en 1.ª ronda','var(--c3)'],['Asignada en 2.ª ronda','var(--c4)'],['Sin cubrir','var(--red)']])+CAT.map(c=>`<div class="hr"><span>${c[0]}</span><div class="tr"><i style="width:${c[1]/mx*100}%;background:var(--c3)"></i><i style="width:${c[2]/mx*100}%;background:var(--c4)"></i><i style="width:${c[3]/mx*100}%;background:var(--red)"></i></div><b>${c[1]+c[2]+c[3]}</b></div>`).join(''))}
${card(6,'Cobertura por categoría y franja','Solicitudes asignadas ÷ recibidas. Más rojo = menor cobertura',heat(CAT.map(c=>c[0]),FR,(i,j)=>Math.max(.4,cb[i]-fp[j]),v=>`<td style="background:color-mix(in srgb,var(--red) ${Math.min(70,Math.round((1-v)*220))}%,#FDEDEB)">${Math.round(v*100)} %</td>`)+'<p class="note">Las celdas rojas marcan dónde convocar conductores u operadores de vans.</p>')}</div>`};

const FUN=[['Consultas recibidas',1000],['Consultas válidas',860],['Cotizadas',710],['Reservas confirmadas',540],['Servicios realizados',497]];
const P3=()=>`<h2>3. Desempeño comercial</h2><p class="lead">Qué canales, segmentos y anticipaciones convierten mejor, dónde se cancelan servicios y cuánto aporta cada combinación a la comisión de la empresa.</p>
<div class="g">${kpi('Conversión consulta a reserva',pc(540/860*100,1),'confirmadas ÷ consultas válidas','var(--c1)')}${kpi('Tasa de cancelación','6,4 %','canceladas ÷ confirmadas','var(--red)')}${kpi('Ticket promedio','$ 48.500','facturación ÷ servicios realizados','var(--c2)')}${kpi('Comisión de la empresa','$ 6,0 M','25 % de los servicios realizados','var(--c3)')}</div>
<div class="g">${card(6,'Embudo de consulta a servicio','Cantidad y porcentaje sobre la etapa anterior',FUN.map(([l,v],i)=>`<div class="hr fr"><span>${l}</span><div class="tr"><i style="width:${v/10}%;background:color-mix(in srgb,var(--c1) ${100-i*14}%,var(--sf))"></i></div><b>${fm(v)}${i?' · '+Math.round(v/FUN[i-1][1]*100)+' %':''}</b></div>`).join(''))}
${card(6,'Conversión y cancelación por segmento','Conversión de consultas válidas',hb([['Agencia',74],['Empresa',66],['Particular',61]],80,v=>v+' %','var(--c1)')+'<div class="sub" style="margin-top:14px">Cancelación sobre reservas confirmadas</div>'+hb([['Particular',9.1],['Empresa',6],['Agencia',4.2]],12,v=>pc(v,1),'var(--red)'))}</div>
<div class="g">${card(6,'Conversión según anticipación de la solicitud','Evalúa la regla de no tomar reservas con menos de 24 h',`<div class="cols">${[['24–48 h',42],['2–7 días',63],['Más de 7 días',74]].map(([l,v])=>`<div class="col"><b>${v} %</b><i style="height:${v*1.7}px;background:var(--c2)"></i><span>${l}</span></div>`).join('')}</div>`)}
${card(6,'Comisión por categoría','Millones de pesos (25 % de los servicios realizados)',hb([['Auto Urbano',2.9],['Auto Ejecutivo',1.9],['Kangoo',.7],['Van',.5]],3,v=>'$ '+v.toLocaleString('es-AR',{minimumFractionDigits:1})+' M','var(--c3)'))}</div>`;

const fr=[630,790,650,625,660],fc=[0,.1,.11,.12,.13];
const P4=()=>`<h2>4. Proyección de demanda</h2><p class="lead">Se habilita cuando exista un ciclo anual completo de historial. Muestra la demanda estimada y el error de las previsiones anteriores.</p>
<div class="g">${kpi('Error de pronóstico (MAPE)','8,4 %','promedio de |proyectado − real| ÷ real','var(--c2)')}${kpi('Demanda estimada, próximos 4 meses',fm(sum(fr.slice(1))),'solicitudes proyectadas','var(--c1)')}${kpi('Mes de mayor demanda prevista','Jul · 790','receso invernal','var(--c4)')}${kpi('Historial requerido','12 meses','mínimo para proyectar','var(--c3)')}</div>
<div class="g">${card(12,'Solicitudes reales y previsión','Línea punteada: previsión con intervalo de confianza. Zona sombreada: meses proyectados',lgd([['Reales','var(--c1)'],['Previsión','var(--c2)',1]])+line(M.concat(['Jul','Ago','Sep','Oct']),[{v:R.concat([null,null,null,null]),c:'var(--c1)'},{v:Array(11).fill(null).concat(fr),c:'var(--c2)',d:1}],{band:{hi:Array(11).fill(null).concat(fr.map((v,i)=>Math.round(v*(1+fc[i])))),lo:Array(11).fill(null).concat(fr.map((v,i)=>Math.round(v*(1-fc[i]))))},shade:[[12,15]],aria:'Solicitudes reales y previsión de demanda con intervalo'})+'<p class="note">Se evaluará la función de previsión de Power BI antes de usarla para planificar flota.</p>')}</div>`;

const dims=[['Calendario','fecha · feriado · pasajeros ANAC',20,12],['Punto de servicio','Ezeiza · Aeroparque · Retiro',265,12],['Categoría','Urbano · Ejecutivo · Kangoo · Van',510,12],['Segmento de cliente','particular · empresa · agencia',20,272],['Canal','WhatsApp · formulario web',265,272],['Conductor','categoría · disponibilidad',510,272]];
const facts=[['Reservas','importe · estado · anticipación','tiempos · cancelación · comisión',130],['Intentos de asignación','envío · respuesta · resultado','tiempo de respuesta',390]];
const star=()=>{let s=`<svg viewBox="0 0 720 330" role="img" aria-label="Modelo en estrella: dos tablas de hechos y seis dimensiones" style="width:100%;height:auto;display:block"><g stroke="var(--mut)" stroke-width="1.4" fill="none"><line x1="115" x2="605" y1="90" y2="90"/><line x1="115" x2="605" y1="240" y2="240"/><line x1="230" x2="230" y1="90" y2="122"/><line x1="490" x2="490" y1="90" y2="122"/><line x1="230" x2="230" y1="206" y2="240"/><line x1="490" x2="490" y1="206" y2="240"/><line x1="330" x2="390" y1="164" y2="164"/>`;
  dims.forEach(d=>{const cx=d[2]+95;s+=d[3]<100?`<line x1="${cx}" x2="${cx}" y1="56" y2="90"/>`:`<line x1="${cx}" x2="${cx}" y1="240" y2="272"/>`});
  s+='</g>';
  dims.forEach(d=>{s+=`<rect x="${d[2]}" y="${d[3]}" width="190" height="44" rx="6" fill="var(--sf)" stroke="var(--ln)"/><text x="${d[2]+95}" y="${d[3]+19}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${d[0]}</text><text class="tx" x="${d[2]+95}" y="${d[3]+35}" text-anchor="middle">${d[1]}</text>`});
  facts.forEach(f=>{s+=`<rect x="${f[3]}" y="122" width="200" height="84" rx="6" fill="color-mix(in srgb,var(--br) 14%,var(--sf))" stroke="var(--br)" stroke-width="1.6"/><text x="${f[3]+100}" y="148" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--ink)">${f[0]}</text><text class="tx" x="${f[3]+100}" y="170" text-anchor="middle">${f[1]}</text><text class="tx" x="${f[3]+100}" y="186" text-anchor="middle">${f[2]}</text>`});
  return s+`<text class="tx" x="360" y="157" text-anchor="middle">1 : N</text></svg>`};
const P5=()=>`<h2>5. Modelo de datos y flujo</h2><p class="lead">Cómo llegan los datos del ERP a Power BI y cómo se organizan en un modelo en estrella.</p>
<div class="g">${card(12,'Flujo de datos propuesto','De las fuentes operativas al tablero de los socios',`<div class="flow"><div><b>Fuentes</b>Botmaker, API de vuelos, app del conductor, facturación</div><div class="ar">›</div><div><b>ERP</b>Ficha única, asignaciones, eventos y facturación</div><div class="ar">›</div><div><b>Exportación</b>CSV o Excel programado en OneDrive o SharePoint</div><div class="ar">›</div><div><b>Power Query</b>ETL, más feriados y pasajeros ANAC</div><div class="ar">›</div><div><b>Modelo en estrella</b>Dos hechos y seis dimensiones</div><div class="ar">›</div><div><b>Power BI</b>Tablero de gestión para los socios</div></div><p class="note">Etapa 2: conexión directa a la base del ERP, con puerta de enlace si corresponde.</p>`)}</div>
<div class="g">${card(12,'Modelo en estrella en Power BI','Las dos tablas de hechos comparten las dimensiones comunes',star())}</div>`;

const PG=[['Demanda y estacionalidad',P1],['Capacidad y cobertura',P2],['Comercial',P3],['Proyección',P4],['Modelo de datos',P5]];
$('#root').innerHTML=PG.map((p,i)=>`<section class="pg${i?'':' on'}" id="p${i}">${p[1]()}</section>`).join('')+'<p class="ft">Maqueta con datos ilustrativos generados para el trabajo integrador; no son datos reales de la empresa.</p>';
$('#tabs').innerHTML=PG.map((p,i)=>`<button data-i="${i}" class="${i?'':'on'}">${i<4?(i+1)+'. ':''}${p[0]}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.pg').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.i));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0)});
</script>
